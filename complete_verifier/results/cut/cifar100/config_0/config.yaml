attack:
  pgd_order: middle
  pgd_restarts: 10
bab:
  branching:
    candidates: 7
    reduceop: max
  cut:
    bab_cut: true
    biccos:
      auto_param: false
      enabled: true
      multi_tree_branching:
        enabled: true
        restore_best_tree: true
    cplex_cuts: true
    enabled: true
    number_cuts: 500
  interm_transfer: true
  tree_traversal: breadth_first
general:
  csv_name: instances.csv
  root_path: ../vnncomp2025_benchmarks/benchmarks/cifar100_2024
model:
  onnx_optimization_flags:
  - merge_bn
solver:
  alpha-crown:
    alpha_dtype: float16
    full_conv_alpha: false
    iteration: 20
    lr_alpha: 0.25
  auto_enlarge_batch_size: true
  batch_size: 128
  beta-crown:
    iteration: 10
    lr_alpha: 0.1
    lr_beta: 0.2
specification:
  norm: .inf
